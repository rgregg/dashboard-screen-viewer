name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test

  lint:
    name: Lint scripts and infrastructure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: ShellCheck
        run: |
          command -v shellcheck >/dev/null || sudo apt-get install --yes shellcheck
          shellcheck scripts/*.sh
      - name: Python syntax
        run: python3 -m py_compile scripts/wifi-setup.py scripts/make-sample-dashboards.py
      - name: Bicep build and lint
        run: |
          az bicep install
          az bicep build --file infra/main.bicep --stdout > /dev/null
          az bicep lint --file infra/main.bicep

  image:
    name: Build gateway image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/gateway.Dockerfile
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
