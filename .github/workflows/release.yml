name: Release

# Publishing a GitHub release tagged vX.Y.Z runs CI, then pushes the gateway image to
# ghcr.io/OWNER/dashboard-screen-viewer-gateway as X.Y.Z, X.Y and (for non-prereleases) latest.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  publish-image:
    name: Publish gateway image
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/dashboard-screen-viewer-gateway
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          flavor: |
            latest=${{ !github.event.release.prerelease }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/gateway.Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Summary
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/dashboard-screen-viewer-gateway:${{ steps.meta.outputs.version }}
        run: |
          {
            echo "### Gateway image published"
            echo
            echo '```'
            echo "$TAGS"
            echo '```'
            echo
            echo "Deploy it with \`GATEWAY_IMAGE=$IMAGE scripts/deploy-gateway.sh\`."
          } >> "$GITHUB_STEP_SUMMARY"
